version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: career_flow_postgres
    environment:
      POSTGRES_USER: career_flow
      POSTGRES_PASSWORD: dev_password_change_in_prod
      POSTGRES_DB: career_flow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_flow -d career_flow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local